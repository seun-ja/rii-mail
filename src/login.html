<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login</title>
        <script type="module" src="/login.js" defer></script>
    </head>

    <body>
        <main class="login-page setup-page">
            <div class="login-container setup-container">
                <div
                    id="init-loading"
                    class="login-loading"
                    aria-live="polite"
                    aria-busy="true"
                >
                    <div class="login-loading-spinner" aria-hidden="true"></div>
                    <p id="init-loading-text" class="login-loading-text">
                        Checking account status...
                    </p>
                </div>

                <div
                    id="login-content"
                    class="login-content hidden"
                    aria-hidden="true"
                >
                    <header class="setup-header login-header">
                        <div class="setup-brand">
                            <img
                                class="setup-brand-img"
                                src="/assets/mail.png"
                                alt="RiiMail"
                            />
                        </div>
                        <p class="setup-step">Email account</p>
                        <h1></h1>Sign in to your inbox</h1>
                        <p class="setup-subtitle">
                            Enter the credentials for the email provider you selected.
                        </p>
                    </header>

                    <form id="login-form" class="login-form">
                        <div class="form-group">
                            <label for="username-input">Email Address</label>
                            <input
                                id="username-input"
                                name="username"
                                type="email"
                                placeholder="your@email.com"
                                required
                            />
                            <small class="form-hint"
                                >Your email address for authentication</small
                            >
                        </div>

                        <div class="form-group">
                            <label for="password-input">Password</label>
                            <div class="password-input-wrap">
                                <input
                                    id="password-input"
                                    name="password"
                                    type="password"
                                    autocomplete="current-password"
                                    placeholder="Enter your password"
                                    required
                                />
                                <button
                                    id="password-toggle"
                                    class="password-toggle"
                                    type="button"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                    title="Show password"
                                >
                                    <svg
                                        class="password-show-icon"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        aria-hidden="true"
                                    >
                                        <path
                                            d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                                            stroke="currentColor"
                                            stroke-width="1.8"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        />
                                        <circle
                                            cx="12"
                                            cy="12"
                                            r="2.5"
                                            stroke="currentColor"
                                            stroke-width="1.8"
                                        />
                                    </svg>
                                    <svg
                                        class="password-hide-icon"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        aria-hidden="true"
                                    >
                                        <path
                                            d="M4 4 20 20M10.6 6.15A8.3 8.3 0 0 1 12 6c6 0 9.5 6 9.5 6a15.7 15.7 0 0 1-2.15 2.8M7.1 7.1C4.15 8.75 2.5 12 2.5 12s3.5 6 9.5 6a8.5 8.5 0 0 0 3.05-.55M9.9 9.9a3 3 0 0 0 4.2 4.2"
                                            stroke="currentColor"
                                            stroke-width="1.8"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        />
                                    </svg>
                                </button>
                            </div>
                            <small class="form-hint"
                                >Your account password</small
                            >
                        </div>

                        <button type="submit" class="login-button">
                            <span></span>Sign in</span>
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path
                                    d="m9 18 6-6-6-6"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </button>
                    </form>

                    <div
                        id="login-msg"
                        class="login-message"
                        role="status"
                        aria-live="polite"
                    ></div>

                    <p class="setup-privacy login-privacy">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path
                                d="M7 10V8a5 5 0 0 1 10 0v2m-11 0h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1Z"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />
                        </svg>
                        Your credentials are stored securely on this device.
                    </p>
                </div>
            </div>
        </main>
    </body>
</html>
