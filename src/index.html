<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RiiMail</title>
        <script type="module" src="/main.js" defer></script>
    </head>

    <body class="home-page">
        <div class="mail-app">
            <div
                id="sync-overlay"
                class="sync-overlay hidden"
                aria-live="polite"
                aria-busy="true"
            >
                <div class="sync-overlay-card">
                    <div id="sync-message" class="sync-message">Syncing...</div>
                    <div
                        class="sync-progress-track"
                        role="progressbar"
                        aria-valuemin="0"
                        aria-valuemax="100"
                        aria-valuenow="0"
                    >
                        <div
                            id="sync-progress-bar"
                            class="sync-progress-bar"
                        ></div>
                    </div>
                </div>
            </div>

            <header class="mail-topbar">
                <div class="topbar-brand">
                    <span class="brand-icon" aria-hidden="true">
                        <img
                            src="/assets/icon.png"
                            alt=""
                            class="brand-icon-img"
                        />
                    </span>

                    <div>
                        <h1>RiiMail</h1>
                        <p>Unified Inbox</p>
                    </div>
                </div>

                <div class="topbar-center">
                    <input
                        id="global-search"
                        class="global-search"
                        type="search"
                        placeholder="Search mail..."
                    />
                </div>

                <div class="topbar-actions">
                    <button
                        id="compose-btn"
                        class="action-btn primary"
                        type="button"
                    >
                        ✏ Compose
                    </button>

                    <button id="refresh-btn" class="action-btn" type="button">
                        Refresh
                    </button>

                    <button
                        id="spam-check-btn"
                        class="action-btn"
                        type="button"
                    >
                        Detect Phishing
                    </button>
                </div>
            </header>

            <div class="mail-body">
                <aside class="mail-sidebar">
                    <div class="sidebar-head">
                        <h2 class="sidebar-title">Mailboxes</h2>
                        <button
                            id="sidebar-toggle-btn"
                            class="sidebar-toggle-btn"
                            type="button"
                            aria-expanded="true"
                            aria-label="Collapse mailbox section"
                        >
                            <img
                                src="/assets/collapse.png"
                                alt=""
                                class="sidebar-toggle-icon"
                            />
                        </button>
                    </div>
                    <div class="sidebar-group" id="folder-section">
                        <button
                            class="folder-btn active"
                            type="button"
                            data-folder="INBOX"
                        >
                            <span class="folder-label">Inbox</span>
                            <span class="folder-count" id="count-inbox">0</span>
                        </button>
                        <button
                            class="folder-btn"
                            type="button"
                            data-folder="starred"
                        >
                            <span class="folder-label">Starred</span>
                            <span class="folder-count" id="count-starred"
                                >0</span
                            >
                        </button>
                        <button
                            class="folder-btn"
                            type="button"
                            data-folder="Sent"
                        >
                            <span class="folder-label">Sent</span>
                            <span class="folder-count" id="count-sent">0</span>
                        </button>
                        <button
                            class="folder-btn"
                            type="button"
                            data-folder="Trash"
                        >
                            <span class="folder-label">Trash</span>
                            <span class="folder-count" id="count-archive"
                                >0</span
                            >
                        </button>
                    </div>
                </aside>

                <section class="mail-list-panel">
                    <div class="mail-list-head">
                        <input
                            id="mail-search"
                            class="mail-search"
                            type="search"
                            placeholder="Search by sender, subject, or preview"
                        />
                        <button
                            id="mark-read-btn"
                            class="small-btn"
                            type="button"
                        >
                            Mark Read
                        </button>
                        <button
                            id="archive-btn"
                            class="small-btn"
                            type="button"
                        >
                            Archive
                        </button>
                    </div>
                    <ul
                        id="mail-list"
                        class="mail-list"
                        aria-label="Email list"
                    ></ul>
                </section>

                <div
                    id="reader-resizer"
                    class="mail-resizer"
                    role="separator"
                    aria-orientation="vertical"
                    aria-label="Resize email list and reader"
                ></div>

                <section class="mail-reader-panel">
                    <div id="mail-reader" class="mail-reader empty-state">
                        <h2>No email selected</h2>
                        <p>Select an email from the list to preview details.</p>
                    </div>
                </section>
            </div>
        </div>

        <div
            id="result-msg"
            class="status-toast"
            role="status"
            aria-live="polite"
        ></div>
        <div id="compose-modal" class="modal hidden">
            <div class="modal-content composer-modal">
                <div class="modal-header">
                    <h2 class="modal-title">New Message</h2>

                    <button
                        id="close-compose-btn"
                        class="composer-close-btn"
                        type="button"
                    >
                        ✕
                    </button>
                </div>

                <div class="composer-fields">
                    <div class="composer-row">
                        <span class="composer-label">To</span>

                        <input
                            id="compose-to"
                            class="composer-input"
                            type="email"
                            placeholder="recipient@example.com"
                        />
                    </div>

                    <div
                        id="compose-cc-row"
                        class="composer-row composer-extra hidden"
                    >
                        <span class="composer-label">CC</span>

                        <input
                            id="compose-cc"
                            class="composer-input"
                            type="text"
                            placeholder="cc@example.com"
                        />
                    </div>

                    <div
                        id="compose-bcc-row"
                        class="composer-row composer-extra hidden"
                    >
                        <span class="composer-label">BCC</span>

                        <input
                            id="compose-bcc"
                            class="composer-input"
                            type="text"
                            placeholder="bcc@example.com"
                        />
                    </div>

                    <div class="composer-row">
                        <span class="composer-label">Subject</span>

                        <input
                            id="compose-subject"
                            class="composer-input"
                            type="text"
                            placeholder="What's on your mind?"
                        />
                    </div>
                </div>

                <div class="composer-editor-wrapper">
                    <textarea
                        id="compose-body"
                        class="composer-editor"
                        placeholder="Write your message..."
                    ></textarea>
                </div>

                <div class="composer-footer">
                    <div class="composer-footer-left">
                        <button
                            id="toggle-cc-btn"
                            class="composer-link-btn"
                            type="button"
                        >
                            CC
                        </button>

                        <button
                            id="toggle-bcc-btn"
                            class="composer-link-btn"
                            type="button"
                        >
                            BCC
                        </button>
                    </div>

                    <div class="composer-footer-right">
                        <button
                            id="send-compose-btn"
                            class="action-btn primary composer-send-btn"
                            type="button"
                        >
                            Send Email
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
