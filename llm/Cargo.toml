[package]
name = "llm"
version = "0.1.0"
description = "LLM Library"
authors = ["Aminu Oluwaseun Joshua @seun-ja"]
edition = "2021"

[dependencies]
async-trait = "0.1.89"

rig-core = "0.33.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.117"
schemars = "1.2.1"
reqwest = { version = "0.13.5", features = ["json"] }

aws-sdk-sagemakerruntime = "1"
aws-sdk-sagemaker = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }

thiserror = "2.0.18"

tracing = { version = "0.1.44", optional = true }

pyo3 = "0.21"
hex = "0.4.3"
