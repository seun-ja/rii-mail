[package]
name = "riimail"
version = "0.1.0"
description = "Personal Email Client"
authors = ["Aminu Oluwaseun Joshua @seun-ja"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "riimail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

async-trait = "0.1.89"
tokio = { version = "1.38.0", features = ["full", "tracing"] }
tokio-util = "0.7.18"
futures = "0.3.28"

reqwest = { version = "0.13.5", features = ["form", "json"] }
thiserror = "1.0.61"
base64 = "0.22"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenv = "0.15.0"

async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
lettre = "0.11.22"
mail-parser = "0.11.3"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = [
    "grpc-tonic",
    "tls-roots",
] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
tracing-opentelemetry = "0.32"

sqlx = { version = "=0.8.1", features = [ "runtime-tokio", "sqlite", "chrono"] }

hex = "0.4.3"
arc-swap = "1.7.1"

llm = { path = "../llm" }
rig-core = "0.33.0"
schemars = "1.2.1"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
mac-notification-sys = "=0.6.15"
