[package]
name = "pemail"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pemail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

async-trait = "0.1.89"
tokio = { version = "1.38.0", features = ["full", "tracing"] }
futures = "0.3.28"

thiserror = "1.0.61"
chrono = { version = "0.4.44", features = ["serde"] }
dotenv = "0.15.0"

tarpc = { version = "0.37", features = ["full"] }
rpc-agent = { version = "0.1.5", git = "https://github.com/oluseun-consult/rpc-agent-custom", features = ["tracing"] }

async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }

mail-parser = "0.11.3"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = [
    "grpc-tonic",
    "tls-roots",
] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
tracing-opentelemetry = "0.32"

sqlx = { version = "=0.8.1", features = [ "runtime-tokio", "sqlite", "chrono"] }

rig-core = "0.33.0"

schemars = "1.2.1"

aws-sdk-sagemakerruntime = "1"
aws-sdk-sagemaker = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }

pyo3 = { version = "0.21", features = ["auto-initialize"]}
hex = "0.4.3"
arc-swap = "1.7.1"
